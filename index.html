<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f0f2f5;--bg2:#fff;--bg3:#fff;--grid:rgba(45,140,240,.05);--glow:rgba(45,140,240,.06);
--t1:#333;--t2:#666;--t3:#999;--brd:#dde2e8;--bra:rgba(45,140,240,.3);
--sh:0 2px 10px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);
--inp:#fff;--ac:#4a90d9;--acl:rgba(74,144,217,.15);--acg:rgba(74,144,217,.25);
--res:#f0f4f8;--btn:#f0f2f5;--btnt:#555;--qb:rgba(74,144,217,.05);--qbr:rgba(74,144,217,.15)
}
[data-theme="dark"]{
--bg:#1a1a2e;--bg2:#16213e;--bg3:#16213e;--grid:rgba(45,140,240,.04);--glow:rgba(45,140,240,.1);
--t1:#e0e0e0;--t2:#a0a0a0;--t3:#555;--brd:#2a3a5c;--bra:rgba(79,195,247,.3);
--sh:0 0 60px rgba(45,140,240,.1),0 20px 60px rgba(0,0,0,.7);
--inp:#1a1a2e;--ac:#4fc3f7;--acl:rgba(79,195,247,.15);--acg:rgba(79,195,247,.25);
--res:rgba(79,195,247,.05);--btn:#1a1a2e;--btnt:#ccc;--qb:rgba(79,195,247,.05);--qbr:rgba(79,195,247,.15)
}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:10px;color:var(--t1);font-size:17px;transition:background .4s,color .4s}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,var(--glow) 0%,transparent 70%);pointer-events:none;z-index:0}
.container{background:var(--bg3);border:1px solid var(--bra);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);width:100%;max-width:440px;position:relative;z-index:1;transition:background .4s,border-color .4s,box-shadow .4s}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:24px;font-weight:300;color:var(--ac);text-shadow:0 0 20px var(--acg);letter-spacing:2px;margin:0}
.subtitle{font-size:12px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.lang-btn,.theme-toggle{border:1px solid var(--bra);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--ac);transition:all .3s}
.lang-btn:hover,.theme-toggle:hover{background:var(--acl);border-color:var(--ac)}
.categories{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:6px 10px;font-size:14px;border:1px solid var(--bra);border-radius:6px;cursor:pointer;transition:all .3s;font-weight:600;background:var(--btn);color:var(--btnt)}
.cat-btn:hover{background:var(--acl);color:var(--ac);border-color:var(--ac)}
.cat-btn.active{background:var(--acl);color:var(--ac);border-color:var(--ac);box-shadow:0 0 12px var(--acg)}
.converter{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:14px;transition:background .4s,border-color .4s}
.input-group{margin-bottom:10px}
.input-group label{display:block;font-size:13px;color:var(--ac);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.input-row{display:flex;gap:6px}
.input-row input{flex:1;padding:10px 14px;border:2px solid var(--bra);border-radius:10px;font-size:20px;background:var(--inp);color:var(--t1);outline:none;transition:all .3s;font-weight:500;min-width:0}
.input-row input:focus{border-color:var(--ac);box-shadow:0 0 10px var(--acg)}
.input-row input::placeholder{color:var(--t3)}
select{padding:8px 10px;border:2px solid var(--bra);border-radius:10px;font-size:16px;background:var(--inp);color:var(--t1);outline:none;cursor:pointer;transition:all .3s;font-weight:500;min-width:0;flex:1}
select:focus{border-color:var(--ac);box-shadow:0 0 10px var(--acg)}
option{background:var(--inp);color:var(--t1)}
.swap-btn{display:flex;justify-content:center;margin:6px 0}
.swap-btn button{padding:6px 20px;font-size:20px;border:2px solid var(--bra);border-radius:10px;cursor:pointer;transition:all .3s;background:var(--btn);color:var(--ac);font-weight:700}
.swap-btn button:hover{background:var(--acl);border-color:var(--ac)}
.result{text-align:center;font-size:18px;color:var(--ac);margin-top:12px;padding:12px;background:var(--res);border-radius:10px;border:1px solid var(--qbr);font-weight:600;min-height:50px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:pointer;transition:background .4s,border-color .4s}
.result:active{transform:scale(.97)}
.result .rv{color:var(--t1);font-size:22px}
.result .rl{font-size:12px;color:var(--t2);font-weight:400}
.copied-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 24px;border-radius:20px;font-size:15px;font-weight:600;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none}
.copied-toast.show{opacity:1}
.rate-info{font-size:11px;color:var(--t2);text-align:center;margin-top:6px;opacity:.7}
.quick-ref-title{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;font-weight:600}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.quick-item{background:var(--qb);border:1px solid var(--qbr);border-radius:6px;padding:6px 8px;text-align:center}
.quick-item .val{font-size:16px;font-weight:700;color:var(--ac)}
.quick-item .lbl{font-size:11px;color:var(--t2);margin-top:2px}
@keyframes resultPop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.animate-result{animation:resultPop .4s cubic-bezier(.68,-.55,.265,1.55) forwards}

<script>

const swCode=`
const CACHE='converter-v2';
self.addEventListener('install',e=>{self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});
self.addEventListener('fetch',e=>{
e.respondWith(
caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
const clone=res.clone();
caches.open(CACHE).then(c=>c.put(e.request,clone));
return res;
}).catch(()=>caches.match(e.request)))
);
});`;
const blob=new Blob([swCode],{type:'application/javascript'});
navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

},

},

let currentCategory='length';
let ratesLoaded=false;
let ratesTime=null;

// === LANGUAGE & UI ===
function updateLang(){
const t=L[lang];
document.getElementById('titleText').textContent=t.title;
document.getElementById('subtitleText').textContent=t.subtitle;
document.getElementById('labelFrom').textContent=t.from;
document.getElementById('labelTo').textContent=t.to;
document.getElementById('langBtn').textContent=lang==='ru'?'EN':'РУ';
document.documentElement.lang=lang;
localStorage.setItem('converterLang',lang);
initCategories();
populateUnits();
convert();
}
function toggleLang(){lang=lang==='ru'?'en':'ru';updateLang()}

function initCategories(){
const c=document.getElementById('categories');
const t=L[lang];
c.innerHTML='';
for(const key of Object.keys(categories)){
const btn=document.createElement('button');
btn.className='cat-btn'+(key===currentCategory?' active':'');
btn.textContent=t.cats[key];
btn.onclick=e=>selectCategory(key,e.target);
c.appendChild(btn);
}
}

function selectCategory(key,el){
currentCategory=key;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
if(el)el.classList.add('active');
populateUnits();
convert();
}

function populateUnits(){
const cat=categories[currentCategory];
const fs=document.getElementById('fromUnit');
const ts=document.getElementById('toUnit');
fs.innerHTML='';ts.innerHTML='';
for(const[key,unit]of Object.entries(cat.units)){
const o1=document.createElement('option');o1.value=key;o1.textContent=unit.name[lang];fs.appendChild(o1);
const o2=document.createElement('option');o2.value=key;o2.textContent=unit.name[lang];ts.appendChild(o2);
}
fs.value=cat.defaultFrom;ts.value=cat.defaultTo;
}

function convertTemperature(v,f,t){
let c;if(f==='c')c=v;else if(f==='f')c=(v-32)*5/9;else if(f==='k')c=v-273.15;
if(t==='c')return c;if(t==='f')return c*9/5+32;if(t==='k')return c+273.15;
}

function convert(){
const cat=categories[currentCategory];
const fv=parseFloat(document.getElementById('fromValue').value);
const fu=document.getElementById('fromUnit').value;
const tu=document.getElementById('toUnit').value;
const t=L[lang];
const ri=document.getElementById('rateInfo');
ri.textContent='';

if(isNaN(fv)){
document.getElementById('toValue').value='';
document.getElementById('resultValue').textContent='—';
document.getElementById('resultLabel').textContent=t.enter;
document.getElementById('quickRef').innerHTML='';
return;
}

let result;
if(cat.units[fu].custom){
result=convertTemperature(fv,fu,tu);
}else if(currentCategory==='currency'&&ratesLoaded){
// Currency: factor = "1 USD = X units", so FROM->USD then USD->TO
const inUsd=fv/cat.units[fu].factor;
result=inUsd*cat.units[tu].factor;
}else{
result=fv*cat.units[fu].factor/cat.units[tu].factor;
}

const fmt=Math.abs(result)>=1000?result.toFixed(2):Math.abs(result)>=1?result.toFixed(4):result.toFixed(6);
document.getElementById('toValue').value=fmt;

const fn=cat.units[fu].name[lang];
const tn=cat.units[tu].name[lang];
document.getElementById('resultValue').textContent=fmt+' '+tn;
document.getElementById('resultLabel').textContent=fv+' '+fn+' = '+fmt+' '+tn;

// Currency rate info
if(currentCategory==='currency'&&ratesLoaded){
const fromCode=fu.replace('try_','TRY').toUpperCase();
const toCode=tu.replace('try_','TRY').toUpperCase();
const rate=cat.units[tu].factor/cat.units[fu].factor;
ri.textContent=lang==='ru'
?'1 '+fromCode+' = '+rate.toFixed(4)+' '+toCode+' · '+ratesTime
:'1 '+fromCode+' = '+rate.toFixed(4)+' '+toCode+' · '+ratesTime;
}

const r=document.getElementById('result');
r.classList.remove('animate-result');void r.offsetWidth;r.classList.add('animate-result');

updateQuickRefs(fv,fu);
}

function updateQuickRefs(value,fu){
const cat=categories[currentCategory];
const c=document.getElementById('quickRef');
const t=L[lang];
if(!cat.quickRefs){c.innerHTML='';return;}

let refs;
if(cat.units[fu].custom)refs=cat.quickRefs(value,fu);
else refs=cat.quickRefs(value*cat.units[fu].factor);

let h='<div class="quick-ref-title">'+t.quick+'</div><div class="quick-grid">';
refs.forEach(r=>{h+='<div class="quick-item"><div class="val">'+r.v+'</div><div class="lbl">'+r.l[lang]+'</div></div>';});
h+='</div>';c.innerHTML=h;
}

function swapUnits(){
const f=document.getElementById('fromUnit'),t=document.getElementById('toUnit');
const tmp=f.value;f.value=t.value;t.value=tmp;convert();
}

function copyResult(){
const rv=document.getElementById('resultValue').textContent;
if(rv==='—')return;
navigator.clipboard.writeText(rv).then(()=>{
const toast=document.getElementById('toast');
toast.textContent=L[lang].copied;
toast.classList.add('show');
setTimeout(()=>toast.classList.remove('show'),1200);
}).catch(()=>{});
}

// === REAL EXCHANGE RATES ===
async function fetchRates(){
try{
const res=await fetch('https://api.exchangerate-api.com/v4/latest/USD');
const data=await res.json();
if(data.rates){
const u=categories.currency.units;
const m={usd:'USD',eur:'EUR',gbp:'GBP',rub:'RUB',gel:'GEL',try_:'TRY',cny:'CNY',jpy:'JPY'};
for(const[k,code]of Object.entries(m)){
if(data.rates[code])u[k].factor=data.rates[code];
}
ratesLoaded=true;
const d=new Date();
ratesTime=d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US',{hour:'2-digit',minute:'2-digit'});
if(currentCategory==='currency')convert();
}
}catch(e){
// Fallback from openmind
try{
const res2=await fetch('https://open.er-api.com/v6/latest/USD');
const data2=await res2.json();
if(data2.rates){
const u=categories.currency.units;
const m={usd:'USD',eur:'EUR',gbp:'GBP',rub:'RUB',gel:'GEL',try_:'TRY',cny:'CNY',jpy:'JPY'};
for(const[k,code]of Object.entries(m)){
if(data2.rates[code])u[k].factor=data2.rates[code];
}
ratesLoaded=true;
const d=new Date();
ratesTime=d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US',{hour:'2-digit',minute:'2-digit'});
if(currentCategory==='currency')convert();
}
}catch(e2){
console.log('Rates unavailable, using fallback');
const u=categories.currency.units;
u.usd.factor=1;u.eur.factor=.93;u.gbp.factor=.79;
u.rub.factor=91.5;u.gel.factor=2.7;u.try_.factor=32;
u.cny.factor=7.2;u.jpy.factor=155;
ratesLoaded=false;
}
}
}

fetchRates();
setInterval(fetchRates,15*60*1000);

// === THEME ===
function initTheme(){
const s=localStorage.getItem('theme')||'light';
document.documentElement.setAttribute('data-theme',s);
updateThemeBtn();
}
function toggleTheme(){
const c=document.documentElement.getAttribute('data-theme');
const n=c==='dark'?'light':'dark';
document.documentElement.setAttribute('data-theme',n);
localStorage.setItem('theme',n);
updateThemeBtn();
}
function updateThemeBtn(){
document.getElementById('themeBtn').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'🌙':'☀️';
}

// === INIT ===
initTheme();
updateLang();
</script>
